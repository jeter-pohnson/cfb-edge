name: Build board

on:
  # Manual only. Every run costs 3 of the 500 monthly odds credits, and you
  # asked to control that yourself, so nothing fires on a timer.
  workflow_dispatch:

  # If you ever want the closing lines captured accurately without remembering
  # to press the button, delete the leading # from the three lines below. That
  # is 4 runs a week, 12 credits a month, and it is the only thing a schedule
  # buys you that a manual run cannot.
  # schedule:
  #   # Saturday 11am, 3pm, 7pm and 11pm Eastern, in UTC.
  #   - cron: "0 15,19,23,3 * * 6,0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: cfbd-cache-${{ github.run_id }}
          restore-keys: cfbd-cache-

      - name: Build
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFB_SEASON: "2026"
        run: python -m pipeline.build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
