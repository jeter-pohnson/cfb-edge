name: Build board

on:
  schedule:
    # Times are UTC. This is 8am, 2pm and 7pm Eastern, Tuesday through Saturday.
    # Fifteen runs a week costs about 195 of the 500 monthly odds credits.
    - cron: "0 12,18,23 * * 2,3,4,5,6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: cfbd-cache-${{ github.run_id }}
          restore-keys: cfbd-cache-

      - name: Build
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFB_SEASON: "2026"
        run: python -m pipeline.build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
