name: Build board

on:
  # Press this yourself any time.
  workflow_dispatch:

  # Sunday and Monday only, when next week's numbers post.
  #
  # This is not a convenience schedule. Three seasons of backtesting found the
  # model's only measurable edge against opening lines, 53.3% versus 50.6% at
  # the close, and that edge is gone by kickoff. Seeing a number late is seeing
  # the wrong number. Six runs a week is 18 of the 500 monthly odds credits.
  #
  # Delete these three lines if you would rather spend nothing without pressing
  # the button, but know that it removes the only effect that measured.
  schedule:
    # Sunday and Monday, 9am, 1pm and 6pm Eastern, expressed in UTC.
    - cron: "0 13,17,22 * * 0,1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: cfbd-cache-${{ github.run_id }}
          restore-keys: cfbd-cache-

      - name: Build
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFB_SEASON: "2026"
        run: python -m pipeline.build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
